<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Acesso - Login</title>
  <link rel="stylesheet" href="style_login.css">
  <!-- Ícones do Font Awesome para o olho da senha -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="logo-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2>Acesso ao Sistema</h2>
      <p>Insira suas credenciais para continuar</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <!-- Campo de Usuário / E-mail -->
      <div class="input-group">
        <label for="username">Usuário ou E-mail</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user input-icon"></i>
          <input 
            type="text" 
            id="username" 
            placeholder="digite seu usuário" 
            required 
            autocomplete="username"
          >
        </div>
      </div>

      <!-- Campo de Senha -->
      <div class="input-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
          <i class="fa-regular fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
        </div>
      </div>

      <!-- Opções Adicionais -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember">
          <span>Lembrar-me</span>
        </label>
        <a href="#" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <!-- Mensagem de Erro/Sucesso -->
      <div id="message" class="message-box"></div>

      <!-- Botão de Login -->
      <button type="submit" class="btn-login">
        <span>Entrar</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="login-footer">
      <p>Não tem uma conta? <a href="#">Solicite acesso</a></p>
    </div>
  </div>

  <script src="script_login.js"></script>
</body>
</html>
